name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build

      - name: Package VSIX
        run: npm run package

      - name: Collect VSIX
        run: |
          mkdir -p artifact
          cp ./*.vsix artifact/

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: datapass-fabric-vsix
          path: artifact/*.vsix
          if-no-files-found: error
